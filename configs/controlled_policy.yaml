# Controlled environment with the full FISOR policy stage (diffusion actor) -> GPU.
name: controlled_policy
base:
  env: controlled
  dynamics: "true"
  discount: 0.7
  expectile: 0.9
  round0_steps: 50000
  rounds: 3
  steps_per_round: 10000
  policy: true
  policy_steps: 100000
  eval_episodes: 20
  tag: policy

blocks:
  - axes:
      coverage: [100, 10]
      rule: [none, density_matched, uncertainty_guided, combined]
      budget_frac: [0.2]
      seed: [0, 1, 2]

smoke:
  overrides:
    round0_steps: 300
    steps_per_round: 100
    rounds: 1
    log_every: 50
    policy_steps: 60
    policy_batch_size: 256
    eval_episodes: 1
  axes:
    coverage: [10]
    rule: [none, uncertainty_guided]
    seed: [0]
